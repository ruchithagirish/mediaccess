services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediaccess
      POSTGRES_PASSWORD: mediaccess
      POSTGRES_DB: mediaccess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
    name: mediaccess_app_pgdata
